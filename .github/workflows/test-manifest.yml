name: Test Manifest

on:
  workflow_dispatch:
    inputs:
      test_id:
        description: 'Unique test identifier'
        required: false
      rom_manifest:
        description: 'ROM manifest URL(e.g., https://github.com/LineageOS/android.git)'
        required: true
      rom_branch:
        description: 'ROM manifest branch (e.g., lineage-21.0)'
        required: true
      manifest_content:
        description: 'local_manifest.xml content'
        required: true
        type: string

jobs:
  test-manifest:
    runs-on: ubuntu-latest
    name: Test ${{ inputs.test_id }}
    
    steps:
      - name: Display Test Info
        run: |
          echo "=========================================="
          echo "TEST INFORMATION"
          echo "=========================================="
          echo "Test ID: ${{ inputs.test_id }}"
          echo "ROM: ${{ inputs.rom_manifest }}"
          echo "Branch: ${{ inputs.rom_branch }}"
          echo ""
          echo "Local Manifest Content:"
          echo "----------------------------------------"
          cat << 'EOF'
          ${{ inputs.manifest_content }}
          EOF
          echo "=========================================="

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          echo "Installing dependencies..."
          sudo apt-get update -qq
          sudo apt-get install -y git-core
          pip install lxml
          
          echo "Installing repo tool..."
          wget -q https://storage.googleapis.com/git-repo-downloads/repo
          sudo mv repo /usr/bin/repo
          sudo chmod a+x /usr/bin/repo
          
          echo "Configuring git..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Initialize ROM source
        run: |
          echo "Initializing repo with ROM manifest..."
          mkdir -p rom-source
          cd rom-source
          repo init --depth=1 --no-repo-verify -u ${{ inputs.rom_manifest }} -b ${{ inputs.rom_branch }}
          
          echo "Creating local manifest..."
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/local_manifest.xml << 'EOF'
          ${{ inputs.manifest_content }}
          EOF

      - name: Validate manifest
        continue-on-error: false
        run: |
          cd rom-source
          echo "Validating manifest syntax..."
          # Let repo manifest show any errors - it will fail if there are issues
          repo manifest -o local_manifest.xml
          echo "✅ Manifest syntax is valid!"

      - name: Verify repositories
        run: |
          cd rom-source
          python3 ../scripts/verify_repo.py
